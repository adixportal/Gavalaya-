<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galavaya | Handcrafted Luxury</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#4b132f;
      --gold:#c9a24d;
      --light:#faf6f2;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:var(--light)}

    /* NAV */
    nav{
      position:absolute;top:0;left:0;width:100%;
      padding:20px 8%;
      display:flex;justify-content:space-between;align-items:center;
      z-index:10;color:#fff;
    }
    nav h1{font-family:'Playfair Display',serif;font-size:32px}
    nav ul{list-style:none;display:flex;gap:24px}
    nav ul a{color:#fff;text-decoration:none}

    /* HERO */
    .hero-wrap{
      position:relative;
      height:100vh;
      overflow:hidden;
    }

    .hero-img{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;
    }

    .hero-overlay{
      position:absolute;inset:0;
      background:rgba(0,0,0,.45);
    }

    .hero-content{
      position:relative;
      z-index:2;
      height:100%;
      padding:0 8%;
      display:flex;
      align-items:center;
      color:#fff;
      max-width:700px;
    }

    .hero-content h2{
      font-family:'Playfair Display',serif;
      font-size:56px;line-height:1.2;margin-bottom:20px;
    }
    .hero-content p{margin-bottom:30px}

    .btn{
      padding:14px 36px;border-radius:30px;
      background:var(--gold);color:#000;
      text-decoration:none;font-weight:500;
      display:inline-block;
    }

    /* SECTION */
    section{padding:90px 8%}
    .section-title{text-align:center;margin-bottom:50px}
    .section-title h3{
      font-family:'Playfair Display',serif;
      font-size:38px;color:var(--primary)
    }

    @media(max-width:768px){
      .hero-content h2{font-size:40px}
      nav ul{display:none}
    }
  </style>
</head>
<body>

<nav>
  <h1>Galavaya</h1>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="cart.html">Cart</a></li>
  </ul>
</nav>

<!-- HERO -->
<div class="hero-wrap">
  <!-- 🔥 IMAGE — THIS WILL LOAD 100% -->
  <img
    class="hero-img"
    src="https://picsum.photos/1600/1000?fashion"
    alt="Galavaya Luxury Sarees"
  >

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div>
      <h2>Luxury, Timeless<br>Elegance</h2>
      <p>
        Premium hand embroidered silk sarees and traditional
        kadhai-bunai clothing crafted for luxury lovers.
      </p>
      <a href="shop.html" class="btn">Shop Collection</a>
    </div>
  </div>
</div>

<section>
  <div class="section-title">
    <h3>Signature Collections</h3>
  </div>
</section>

</body>
</html>
