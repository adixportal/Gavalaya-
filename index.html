<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Galavaya | Luxury Ethnic Wear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#4b132f;
      --gold:#c9a24d;
      --light:#faf6f2;
      --dark:#1e1e1e;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:var(--light);
      color:var(--dark);
    }

    /* NAV */
    nav{
      position:absolute;
      top:0;left:0;width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
      color:#fff;
    }
    nav h1{
      font-family:'Playfair Display',serif;
      font-size:32px;
    }
    nav ul{
      list-style:none;
      display:flex;
      gap:24px;
    }
    nav a{
      color:#fff;
      text-decoration:none;
    }

    /* HERO */
    .hero-wrap{
      position:relative;
      height:100vh;
      overflow:hidden;
    }
    .hero-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .hero-overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.45);
    }
    .hero-content{
      position:relative;
      z-index:2;
      height:100%;
      padding:0 8%;
      display:flex;
      align-items:center;
      color:#fff;
      max-width:720px;
    }
    .hero-content h2{
      font-family:'Playfair Display',serif;
      font-size:56px;
      line-height:1.2;
      margin-bottom:20px;
    }
    .hero-content p{
      margin-bottom:30px;
      opacity:.95;
    }
    .btn{
      display:inline-block;
      padding:14px 36px;
      background:var(--gold);
      color:#000;
      text-decoration:none;
      border-radius:30px;
      font-weight:500;
    }

    section{padding:90px 8%}
    .section-title{
      text-align:center;
      margin-bottom:50px;
    }
    .section-title h3{
      font-family:'Playfair Display',serif;
      font-size:38px;
      color:var(--primary);
    }

    /* COLLECTIONS */
    .collections{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:30px;
    }
    .collection{
      height:320px;
      border-radius:20px;
      background-size:cover;
      background-position:center;
      position:relative;
      display:flex;
      align-items:flex-end;
      padding:20px;
      color:#fff;
    }
    .collection::after{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
      border-radius:20px;
    }
    .collection h4{
      position:relative;
      z-index:2;
      font-family:'Playfair Display',serif;
    }

    footer{
      background:#1a0c14;
      color:#fff;
      text-align:center;
      padding:50px 8%;
    }

    @media(max-width:768px){
      .hero-content h2{font-size:40px}
      nav ul{display:none}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <h1>Galavaya</h1>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="cart.html">Cart</a></li>
  </ul>
</nav>

<!-- HERO (LOCAL IMAGE — NO ISSUE EVER) -->
<div class="hero-wrap">
  <img class="hero-img" src="./images/hero.jpg" alt="Galavaya Luxury Wear">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div>
      <h2>Luxury, Timeless<br>Elegance</h2>
      <p>
        Premium hand embroidered silk sarees and
        traditional kadhai–bunai ethnic wear.
      </p>
      <a href="shop.html" class="btn">Shop Collection</a>
    </div>
  </div>
</div>

<!-- COLLECTIONS -->
<section>
  <div class="section-title">
    <h3>Signature Collections</h3>
  </div>

  <div class="collections">
    <div class="collection" style="background-image:url('./images/hero.jpg')">
      <h4>Silk Sarees</h4>
    </div>
    <div class="collection" style="background-image:url('./images/hero.jpg')">
      <h4>Kadhai Bunai Wear</h4>
    </div>
    <div class="collection" style="background-image:url('./images/hero.jpg')">
      <h4>Bridal Collection</h4>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 Galavaya · Handcrafted in India</p>
</footer>

</body>
</html>
