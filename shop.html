<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | Galavaya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body{margin:0;font-family:Poppins;background:#faf6f2}
    nav{padding:20px 8%;background:#4b132f;color:#fff;display:flex;justify-content:space-between}
    nav a{color:#fff;text-decoration:none;margin-left:20px}
    h2{text-align:center;font-family:Playfair Display;margin:60px 0 30px}

    .products{
      padding:0 8% 80px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:30px;
    }

    .product{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }

    .product img{width:100%;height:300px;object-fit:cover}
    .info{padding:20px}
    .btn{
      display:inline-block;margin-top:10px;
      background:#c9a24d;color:#000;
      padding:10px 24px;border-radius:30px;
      text-decoration:none;font-weight:500;
    }
  </style>
</head>
<body>

<nav>
  <strong>Galavaya</strong>
  <div>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
  </div>
</nav>

<h2>Shop Our Collection</h2>

<div class="products">
  <div class="product">
    <img src="https://images.unsplash.com/photo-1618221710640-c0eaaa2adb49?auto=format&w=800">
    <div class="info">
      <h4>Hand Embroidered Silk Saree</h4>
      <p>₹18,500</p>
      <a href="product.html" class="btn">View Product</a>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&w=800">
    <div class="info">
      <h4>Kadhai Bunai Ethnic Wear</h4>
      <p>₹14,200</p>
      <a href="product.html" class="btn">View Product</a>
    </div>
  </div>
</div>

</body>
</html>
