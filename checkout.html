<!DOCTYPE html>
<html>
<head>
  <title>Checkout | Galavaya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Poppins;background:#faf6f2;margin:0}
    nav{padding:20px 8%;background:#4b132f;color:#fff}
    section{padding:60px 8%;max-width:600px;margin:auto}

    input,textarea{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .btn{
      background:#c9a24d;
      color:#000;
      padding:14px 36px;
      border:none;
      border-radius:30px;
      font-weight:500;
      cursor:pointer;
    }
  </style>
</head>
<body>

<nav>
  <strong>Galavaya</strong>
</nav>

<section>
  <h2>Checkout</h2>

  <form onsubmit="event.preventDefault();alert('Order placed successfully!');">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Phone Number" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Full Address" required></textarea>

    <h3>Total: ₹18,500</h3><br>
    <button class="btn">Place Order</button>
  </form>
</section>

</body>
</html>
